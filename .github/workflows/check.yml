name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y desktop-file-utils python3-gi
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: scripts/check.sh
